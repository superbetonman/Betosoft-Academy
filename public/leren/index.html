<!doctype html>
<html lang="nl-BE">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Mijn opleidingen · Betosoft Academie</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/stijl.css">
</head>
<body>
  <header class="kop">
    <a class="merk" href="/leren/"><span class="merk-blok">B</span><strong>Betosoft Academie</strong></a>
    <div class="rechts"><span class="klein zacht" id="wie"></span><button id="afmelden" class="knop stil klein" type="button">Afmelden</button></div>
  </header>
  <main style="max-width:720px">
    <p class="label" style="margin-top:8px">Mijn opleidingen</p>
    <h1 id="titel">Welkom</h1>
    <p>Je account is actief. De lessen verschijnen hier zodra het leerplatform opent. Je krijgt dan een bericht.</p>
  </main>
  <script type="module">
    import { api, naam, afmelden } from "/gemeen.js"
    document.getElementById("afmelden").addEventListener("click", afmelden)
    const s = await api("/api/sessie")
    if (!s.aangemeld) location.replace("/aanmelden/?terug=/leren/")
    else {
      document.getElementById("wie").textContent = naam(s.gebruiker)
      document.getElementById("titel").textContent = `Welkom, ${s.gebruiker.voornaam || ""}`.trim()
    }
  </script>
</body>
</html>
