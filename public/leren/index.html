<!doctype html>
<html lang="nl-BE">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Mijn opleidingen · Betosoft Academie</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <script src="/thema.js"></script>
  <link rel="stylesheet" href="/stijl.css">
</head>
<body>
  <header class="kop">
  <div class="kop-in">
    <a class="logo" href="/leren/" aria-label="Betosoft Academie, mijn opleidingen"><img src="/logo.svg" alt="" width="34" height="30"><span class="logo-tekst">Betosoft <em>Academie</em></span><span class="kop-context">· mijn opleidingen</span></a>
    <div class="rechts"><span class="klein zacht" id="wie"></span><button id="afmelden" class="knop stil klein" type="button">Afmelden</button></div>
  </div>
</header>
  <main style="max-width:960px">
    <p class="label" style="margin-top:8px">Mijn opleidingen</p>
    <h1 id="titel">Welkom</h1>
    <div id="tester" class="melding verborgen"></div>
    <div id="lijst" class="leerlijst"><p class="zacht">Laden…</p></div>
  </main>
  <style>
    .leerlijst { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 280px), 1fr)); gap: 12px; margin-top: 16px; }
    .leerkaart { background: var(--wit); border: 1px solid var(--lijn); border-radius: var(--r); padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; }
    .leerkaart h2 { border: 0; padding: 0; margin: 0; font-size: 17px; color: var(--inkt); }
    .leerkaart .knoppen { margin-top: auto; padding-top: 8px; }
    .leerkaart a.knop { text-decoration: none; display: inline-flex; align-items: center; }
  </style>
  <script type="module">
    import { api, esc, naam, datum, afmelden } from "/gemeen.js"
    document.getElementById("afmelden").addEventListener("click", afmelden)
    const s = await api("/api/sessie")
    if (!s.aangemeld) location.replace("/aanmelden/?terug=/leren/")
    else {
      document.getElementById("wie").textContent = naam(s.gebruiker)
      document.getElementById("titel").textContent = `Welkom, ${s.gebruiker.voornaam || ""}`.trim()
      const d = await api("/api/leren/cursussen")
      if (d.beheer) {
        const t = document.getElementById("tester")
        t.classList.remove("verborgen")
        t.innerHTML = `<strong>Testermodus.</strong> Als beheerder kun je elke cursus openen en volgen. Je voortgang wordt in je account bewaard. Meld wat je vaststelt met de knop <em>Fout melden</em> rechts op het scherm. <a href="/beheer/">Naar beheer</a>`
      }
      const lijst = document.getElementById("lijst")
      lijst.innerHTML = d.cursussen.length
        ? d.cursussen.map((c) => `<article class="leerkaart">
            <span class="tag" style="align-self:flex-start">${esc(c.code)}</span>
            <h2>${esc(c.titel)}</h2>
            <p class="klein zacht" style="margin:0">${
              c.toegang
                ? c.als_tester ? "Als tester (beheerder)" : c.eind_datum ? `Toegang tot ${esc(datum(c.eind_datum))}` : "Toegang"
                : "Je hebt toegang tot een deel van deze cursus. De volledige cursus opent zodra je toegang hebt tot alle modules."
            }</p>
            <p class="klein" style="margin:0">${c.lessen_af ? `<span class="mono">${c.lessen_af}</span> ${c.lessen_af === 1 ? "les" : "lessen"} afgerond` : "Nog niet gestart"}</p>
            <div class="knoppen">
              ${c.toegang ? `<a class="knop" href="/cursus/${encodeURIComponent(c.code)}/">${c.lessen_af ? "Verder leren" : "Openen"}</a>` : ""}
              ${c.demo ? `<a class="knop licht" href="/demo/${encodeURIComponent(c.code)}/">Demo</a>` : ""}
            </div>
          </article>`).join("")
        : `<p>Je hebt nog geen opleidingen. <a href="/#cursussen">Bekijk de cursussen</a> of vraag je centrale om je een plaats toe te wijzen.</p>`
    }
  </script>
  <footer class="voet">
    <p class="disclaimer">De cursussen zijn met de grootste zorg samengesteld. Raadpleeg in geval van twijfel altijd de normatieve documenten en reglementen; die blijven de referentie.</p>
    <p>Betosoft Academie · <a href="/">startpagina</a> · <a href="/prijzen/">prijzen</a> · <a href="https://betosoft.be">betosoft.be</a></p>
  </footer>
  <script src="/fout.js" type="module"></script>
</body>
</html>
